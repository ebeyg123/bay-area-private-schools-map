<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bay Area Schools Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,sans-serif}#map{height:100%;width:100%}
.title{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:1000;background:rgba(255,255,255,0.96);padding:10px 20px;border-radius:10px;box-shadow:0 3px 14px rgba(0,0,0,0.2);font-size:16px;font-weight:600;white-space:nowrap;pointer-events:none}
.legend{position:absolute;bottom:25px;left:25px;z-index:1000;background:rgba(255,255,255,0.96);padding:12px 14px;border-radius:10px;box-shadow:0 3px 12px rgba(0,0,0,0.18);font-size:13px;line-height:1.7}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle;border:1px solid #222}
</style>
</head>
<body>
<div id="map"></div>
<div class="title">Bay Area Private / Non-Public Schools · Color by Level</div>
<div class="legend"><b>School Level</b><br>
<span class="dot" style="background:#2ecc71"></span>Elementary<br>
<span class="dot" style="background:#e74c3c"></span>High School<br>
<span class="dot" style="background:#3498db"></span>K-12 / Mixed<br>
<div style="margin-top:6px;font-size:11px;color:#555">Click markers · Toggle layers (top-right)</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const C={"Elementary":"#2ecc71","High School":"#e74c3c","K-12 / Mixed":"#3498db"};
const map=L.map("map").setView([37.75,-122.15],9);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"&copy; OSM"}).addTo(map);
const cluster=L.markerClusterGroup({showCoverageOnHover:false});
const layers={"Elementary":L.layerGroup(),"High School":L.layerGroup(),"K-12 / Mixed":L.layerGroup()};
fetch("schools.json").then(r=>r.json()).then(schools=>{
schools.forEach(s=>{
const color=C[s.level]||"#333";
let web=s.website||"";
if(web&&web!=="No Data"&&!web.startsWith("http"))web="https://"+web;
const link=(web&&web!=="No Data")?"<a href=\""+web+"\" target=_blank rel=noopener>"+web+"</a>":"N/A";
const html="<div style=\"font-size:15px;font-weight:700\">"+s.name+"</div><div style=\"display:inline-block;background:"+color+";color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;margin:4px 0\">"+s.level+"</div><div><b>County:</b> "+s.county+"</div><div><b>Grades:</b> "+s.grades+"</div><div><b>Type:</b> "+s.type+"</div><div style=\"margin-top:4px\"><b>Address:</b><br>"+s.address+"</div><div style=\"margin-top:4px\"><b>Website:</b> "+link+"</div>";
const m=L.circleMarker([s.lat,s.lon],{radius:9,color:"#222",weight:1.5,fillColor:color,fillOpacity:0.9});
m.bindPopup(html,{maxWidth:320});
m.bindTooltip(s.name+" · "+s.level+" · "+s.grades);
cluster.addLayer(m);
if(layers[s.level])layers[s.level].addLayer(m);
});
map.addLayer(cluster);
L.control.layers(null,{"All (clustered)":cluster,"Elementary (green)":layers["Elementary"],"High School (red)":layers["High School"],"K-12 / Mixed (blue)":layers["K-12 / Mixed"]}, {collapsed:false}).addTo(map);
}).catch(e=>document.body.insertAdjacentHTML("beforeend","<div style=\"position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#fee;padding:12px;z-index:2000\">Error: "+e.message+"</div>"));
</script>
</body>
</html>
